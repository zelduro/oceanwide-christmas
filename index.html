<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OceanWide Christmas Celebration 2026</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero">

        <div class="top-decoration">✦</div>

        <img
            src="oceanwidelogo.jpg"
            alt="OceanWide Expeditions"
            class="logo"
        >

        <p class="small-text">A SPECIAL CHRISTMAS VOYAGE</p>

        <h1>ALL ABOARD</h1>

        <p class="for-text">FOR</p>

        <h2>CHRISTMAS</h2>

        <p class="event-text">
            OCEANWIDE EXPEDITIONS<br>
            CHRISTMAS CELEBRATION 2026
        </p>

        <div class="ticket">

            <p class="ticket-title">VOYAGE DETAILS</p>

            <div class="details">

                <div>
                    <span>DATE</span>
                    <strong>07 DECEMBER 2026</strong>
                </div>

                <div>
                    <span>REGISTRATION</span>
                    <strong>9:00 AM</strong>
                </div>

                <div>
                    <span>EVENT</span>
                    <strong>10:00 AM</strong>
                </div>

            </div>

        </div>

        <img
            src="ship.png"
            alt="OceanWide expedition ship"
            class="ship"
        >

        <button id="startButton">
            REGISTER NOW
        </button>

        <p class="bottom-text">
            YOUR VOYAGE AWAITS ⚓
        </p>

    </main>

    <script src="script.js"></script>

</body>

</html>
